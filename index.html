<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ดสรุปการแจ้งปัญหา</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'kanit': ['Kanit', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
        /* Custom scrollbar for a modern look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #a8a8a8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #7a7a7a; }
        html.dark ::-webkit-scrollbar-track { background: #2d3748; }
        html.dark ::-webkit-scrollbar-thumb { background: #4a5568; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #718096; }
        
        /* Ensure table images are clickable and have a pointer cursor */
        .table-image {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">

    <!-- Main Application Container -->
    <div id="app" class="min-h-screen p-4 sm:p-6 md:p-8">

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-white/70 dark:bg-black/70 z-[100] flex items-center justify-center hidden backdrop-blur-sm">
            <div class="text-center">
                <svg class="h-12 w-12 animate-spin text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 font-semibold text-gray-700 dark:text-gray-300">กำลังโหลดข้อมูล...</p>
            </div>
        </div>

        <!-- Image Zoom Modal -->
        <div id="image-zoom-modal" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-zoom-out">
            <img id="zoomed-image" src="" alt="Zoomed image" class="max-w-full max-h-full rounded-lg cursor-default">
        </div>

        <!-- Header -->
        <header class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <i data-lucide="layout-dashboard" class="w-8 h-8 text-blue-600 dark:text-blue-400"></i>
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">แดชบอร์ดสรุปภาพรวม</h1>
                </div>
                <div class="flex flex-wrap items-center justify-end gap-2 w-full sm:w-auto">
                    <select id="branch-select" class="w-full sm:w-auto px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500" disabled>
                        <option value="">เลือกสาขา</option>
                    </select>
                    <select id="month-filter" class="w-full sm:w-auto px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500" disabled>
                        <option value="">ทุกเดือน</option>
                    </select>
                    <select id="status-filter" class="w-full sm:w-auto px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500" disabled>
                        <option value="">ทุกสถานะ</option>
                    </select>
                    <button id="refresh-btn" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="รีเฟรชข้อมูล">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                    </button>
                    <button id="print-btn" class="p-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors flex items-center gap-2" disabled>
                        <i data-lucide="printer" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">ปริ้น</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="hidden">
            <!-- Summary Cards -->
            <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <!-- Summary cards will be injected here -->
            </div>

            <!-- Table Container -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md">
                 <h2 id="table-title" class="text-xl font-bold mb-4">รายการแจ้งปัญหา</h2>
                 <div class="overflow-x-auto">
                    <table id="requests-table" class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                            <!-- Table header will be injected here -->
                        </thead>
                        <tbody>
                            <!-- Table body will be injected here -->
                        </tbody>
                    </table>
                 </div>
            </div>
        </main>
        
        <!-- Placeholder for when no branch is selected -->
        <div id="placeholder" class="flex flex-col items-center justify-center text-center text-gray-500 dark:text-gray-400 mt-16">
            <i data-lucide="info" class="w-16 h-16 mb-4"></i>
            <h2 class="text-2xl font-semibold">กรุณาเลือกสาขา</h2>
            <p>เลือกสาขาจากเมนูด้านบนเพื่อแสดงข้อมูลแดชบอร์ด</p>
        </div>
    </div>

    <script type="module">
        // =================================================================================
        // CONFIGURATION
        // =================================================================================
        const GAS_API_URLS = [
            "https://script.google.com/macros/s/AKfycbzKSaLBibuPramXohqbpvBENcxWi97sQMxS4em4c_xCN0ctk78NHzQOTAEK6GPXgdJv/exec",
        ];

        // =================================================================================
        // APP STATE
        // =================================================================================
        let currentBranchName = '';
        let allBranchRequests = []; // Store all requests for the selected branch
        let filteredRequests = []; // Store currently displayed requests

        // =================================================================================
        // DOM ELEMENTS
        // =================================================================================
        const loadingOverlay = document.getElementById('loading-overlay');
        const branchSelect = document.getElementById('branch-select');
        const monthFilter = document.getElementById('month-filter');
        const statusFilter = document.getElementById('status-filter');
        const printBtn = document.getElementById('print-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const mainContent = document.getElementById('main-content');
        const placeholder = document.getElementById('placeholder');
        const summaryCardsContainer = document.getElementById('summary-cards');
        const requestsTableBody = document.querySelector('#requests-table tbody');
        const tableTitle = document.getElementById('table-title');
        const imageZoomModal = document.getElementById('image-zoom-modal');
        const zoomedImage = document.getElementById('zoomed-image');

        // =================================================================================
        // UTILITY FUNCTIONS
        // =================================================================================
        const showLoading = (show) => loadingOverlay.classList.toggle('hidden', !show);

        const statusStyles = {
            "รอดำเนินการ": { text: "text-yellow-800", bg: "bg-yellow-100", border: "border-yellow-400" },
            "กำลังดำเนินการ": { text: "text-blue-800", bg: "bg-blue-100", border: "border-blue-500" },
            "ซ่อมเสร็จแล้ว": { text: "text-green-800", bg: "bg-green-100", border: "border-green-500" },
            "รออะไหล่/ยกเลิก": { text: "text-red-800", bg: "bg-red-100", border: "border-red-500" },
        };

        // =================================================================================
        // API COMMUNICATION
        // =================================================================================
        async function callGasApi(payload) {
            const apiUrl = GAS_API_URLS[0];
            try {
                const urlWithDummyParam = `${apiUrl}?timestamp=${new Date().getTime()}`;
                const response = await fetch(urlWithDummyParam, {
                    method: 'POST', mode: 'cors', cache: 'no-cache',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload), redirect: 'follow'
                });
                if (!response.ok) throw new Error(`Network response was not ok, status: ${response.status}`);
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message || 'API Error');
                return result.data;
            } catch (error) {
                console.error(`API Call Error with ${apiUrl}:`, error.message);
                alert(`เกิดข้อผิดพลาดในการเชื่อมต่อ: ${error.message}`);
                throw error;
            }
        }

        // =================================================================================
        // DATA FETCHING AND RENDERING
        // =================================================================================
        async function loadBranches() {
            showLoading(true);
            try {
                const branches = await callGasApi({ action: 'getBranches' });
                if (branches && branches.length > 0) {
                    branchSelect.innerHTML = '<option value="">-- กรุณาเลือกสาขา --</option>';
                    branches.forEach(branch => {
                        const option = document.createElement('option');
                        option.value = branch.sheetId;
                        option.textContent = branch.branchName;
                        branchSelect.appendChild(option);
                    });
                    branchSelect.disabled = false;
                } else {
                    branchSelect.innerHTML = '<option value="">ไม่พบข้อมูลสาขา</option>';
                }
            } catch (error) {
                console.error("Failed to load branches:", error);
            } finally {
                showLoading(false);
            }
        }

        async function fetchAndDisplayData(sheetId, branchName) {
            if (!sheetId) {
                mainContent.classList.add('hidden');
                placeholder.classList.remove('hidden');
                printBtn.disabled = true;
                monthFilter.disabled = true;
                statusFilter.disabled = true;
                return;
            }
            showLoading(true);
            mainContent.classList.add('hidden');
            placeholder.classList.add('hidden');
            
            try {
                const requests = await callGasApi({ action: 'getRequests', isAdmin: true, sheetId: sheetId });
                allBranchRequests = requests.sort((a, b) => new Date(b.lastUpdated) - new Date(a.lastUpdated));
                currentBranchName = branchName;

                // Reset filters and apply
                monthFilter.value = "";
                statusFilter.value = "";
                applyFiltersAndRender();
                
                tableTitle.textContent = `รายการแจ้งปัญหา - สาขา ${branchName}`;
                mainContent.classList.remove('hidden');
                printBtn.disabled = false;
                monthFilter.disabled = false;
                statusFilter.disabled = false;
            } catch (error) {
                placeholder.classList.remove('hidden');
                placeholder.innerHTML = `<i data-lucide="server-crash" class="w-16 h-16 mb-4 text-red-500"></i><h2 class="text-2xl font-semibold">เกิดข้อผิดพลาด</h2><p>ไม่สามารถโหลดข้อมูลของสาขา ${branchName} ได้</p>`;
                lucide.createIcons();
            } finally {
                showLoading(false);
            }
        }
        
        function applyFiltersAndRender() {
            const statusFilterValue = statusFilter.value;
            const monthFilterValue = monthFilter.value;

            let tempFiltered = [...allBranchRequests];

            if (statusFilterValue) {
                tempFiltered = tempFiltered.filter(req => req.status === statusFilterValue);
            }
            if (monthFilterValue !== "") {
                tempFiltered = tempFiltered.filter(req => new Date(req.date).getMonth() == monthFilterValue);
            }
            
            filteredRequests = tempFiltered; // Update the global filtered list
            updateSummaryCards(filteredRequests);
            renderTable(filteredRequests);
        }

        function updateSummaryCards(requests) {
            const counts = { "รอดำเนินการ": 0, "กำลังดำเนินการ": 0, "ซ่อมเสร็จแล้ว": 0, "รออะไหล่/ยกเลิก": 0 };
            requests.forEach(req => { if (counts.hasOwnProperty(req.status)) counts[req.status]++; });

            summaryCardsContainer.innerHTML = Object.keys(statusStyles).map(status => `
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md border-l-4 ${statusStyles[status].border}">
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">${status}</p>
                    <p class="text-3xl font-bold text-gray-800 dark:text-white mt-2">${counts[status]}</p>
                </div>
            `).join('');
        }

        function renderTable(requests) {
            const tableHead = document.querySelector('#requests-table thead');
            tableHead.innerHTML = `
                <tr>
                    <th scope="col" class="px-4 py-3">ลำดับ</th>
                    <th scope="col" class="px-4 py-3">วันที่แจ้ง</th>
                    <th scope="col" class="px-4 py-3">ปัญหา</th>
                    <th scope="col" class="px-4 py-3">ผู้แจ้ง</th>
                    <th scope="col" class="px-4 py-3">ผู้รับผิดชอบ</th>
                    <th scope="col" class="px-4 py-3">สถานะ</th>
                    <th scope="col" class="px-4 py-3">รูปก่อนแก้ไข</th>
                    <th scope="col" class="px-4 py-3">รูปหลังแก้ไข</th>
                    <th scope="col" class="px-4 py-3">อัปเดตล่าสุด</th>
                </tr>
            `;

            requestsTableBody.innerHTML = '';
            if (requests.length === 0) {
                requestsTableBody.innerHTML = `
                    <tr class="bg-white dark:bg-gray-800">
                        <td colspan="9" class="px-6 py-4 text-center">ไม่พบรายการที่ตรงกับตัวกรอง</td>
                    </tr>
                `;
                return;
            }

            requests.forEach((req, index) => {
                const style = statusStyles[req.status] || { bg: 'bg-gray-100', text: 'text-gray-800' };
                const beforeImgHtml = req.beforeImageUrl ? `<img src="${req.beforeImageUrl}" class="w-14 h-14 object-cover rounded table-image mx-auto">` : 'ไม่มี';
                const afterImgHtml = req.afterImageUrl ? `<img src="${req.afterImageUrl}" class="w-14 h-14 object-cover rounded table-image mx-auto">` : 'ไม่มี';
                
                const row = `
                    <tr class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <td class="px-4 py-2 text-center">${index + 1}</td>
                        <td class="px-4 py-2 text-center">${new Date(req.date).toLocaleDateString('th-TH')}</td>
                        <td class="px-4 py-2 font-medium text-gray-900 dark:text-white">${req.problem}</td>
                        <td class="px-4 py-2 text-center">${req.requesterName}</td>
                        <td class="px-4 py-2 text-center">${req.assignedToName || 'ยังไม่ระบุ'}</td>
                        <td class="px-4 py-2 text-center">
                            <span class="px-2 py-1 font-semibold leading-tight rounded-full ${style.bg} ${style.text}">
                                ${req.status}
                            </span>
                        </td>
                        <td class="px-4 py-2 text-center">${beforeImgHtml}</td>
                        <td class="px-4 py-2 text-center">${afterImgHtml}</td>
                        <td class="px-4 py-2 text-center">${new Date(req.lastUpdated).toLocaleString('th-TH')}</td>
                    </tr>
                `;
                requestsTableBody.innerHTML += row;
            });
        }

        // =================================================================================
        // PRINTING LOGIC
        // =================================================================================
        function handlePrint() {
            if (filteredRequests.length === 0) {
                alert('ไม่มีข้อมูลสำหรับปริ้น');
                return;
            }

            const printWindow = window.open('', '_blank');
            printWindow.document.write('<html><head><title>รายงานสรุป</title>');
            printWindow.document.write(`
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
                    @page { size: landscape; margin: 10mm; }
                    body { font-family: 'Sarabun', sans-serif; }
                    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; font-size: 9px; vertical-align: middle; }
                    th { background-color: #f2f2f2; font-weight: bold; text-align: center; }
                    h1 { text-align: center; margin: 5px 0; font-size: 14px; }
                    h2 { text-align: center; margin: 5px 0; font-size: 12px; font-weight: normal; }
                    .print-header { margin-bottom: 10px; }
                    .print-header p { margin: 2px 0; font-size: 11px; }
                    img { max-width: 70px; max-height: 70px; object-fit: cover; border-radius: 4px; display: block; margin: 0 auto; }
                    @media print { body { -webkit-print-color-adjust: exact; } }
                    /* Add centering for specific columns */
                    td:nth-child(1), 
                    td:nth-child(2), 
                    td:nth-child(4), 
                    td:nth-child(5), 
                    td:nth-child(6), 
                    td:nth-child(7), 
                    td:nth-child(8), 
                    td:nth-child(9) {
                        text-align: center;
                    }
                </style>
            `);
            printWindow.document.write('</head><body>');
            
            // --- Header ---
            const statusText = statusFilter.value || 'ทุกสถานะ';
            const monthText = monthFilter.value !== "" ? monthFilter.options[monthFilter.selectedIndex].text : 'ทุกเดือน';
            printWindow.document.write(`
                <div class="print-header">
                    <h1>รายงานสรุปการแจ้งปัญหา</h1>
                    <h2>สาขา ${currentBranchName}</h2>
                    <p><b>ตัวกรอง:</b> เดือน: ${monthText}, สถานะ: ${statusText}</p>
                    <p><b>วันที่ปริ้น:</b> ${new Date().toLocaleString('th-TH')}</p>
                    <p><b>จำนวนทั้งหมด (ตามตัวกรอง):</b> ${filteredRequests.length} รายการ</p>
                </div>
            `);

            // --- Table ---
            printWindow.document.write('<table>');
            printWindow.document.write('<thead>' + document.querySelector('#requests-table thead').innerHTML + '</thead>');
            printWindow.document.write('<tbody>' + document.querySelector('#requests-table tbody').innerHTML + '</tbody>');
            printWindow.document.write('</table>');
            
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            
            setTimeout(() => {
                printWindow.focus();
                printWindow.print();
                printWindow.close();
            }, 500);
        }
        
        // =================================================================================
        // EVENT LISTENERS & INITIALIZATION
        // =================================================================================
        function populateFilters() {
            statusFilter.innerHTML = '<option value="">ทุกสถานะ</option>';
            for (const status in statusStyles) {
                statusFilter.innerHTML += `<option value="${status}">${status}</option>`;
            }
            const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            monthFilter.innerHTML = '<option value="">ทุกเดือน</option>';
            months.forEach((month, index) => {
                monthFilter.innerHTML += `<option value="${index}">${month}</option>`;
            });
        }

        branchSelect.addEventListener('change', () => {
            const selectedSheetId = branchSelect.value;
            const selectedBranchName = branchSelect.options[branchSelect.selectedIndex].text;
            fetchAndDisplayData(selectedSheetId, selectedBranchName);
        });

        refreshBtn.addEventListener('click', () => {
             const selectedSheetId = branchSelect.value;
            if (selectedSheetId) {
                const selectedBranchName = branchSelect.options[branchSelect.selectedIndex].text;
                fetchAndDisplayData(selectedSheetId, selectedBranchName);
            } else {
                alert('กรุณาเลือกสาขาก่อน');
            }
        });

        printBtn.addEventListener('click', handlePrint);
        statusFilter.addEventListener('change', applyFiltersAndRender);
        monthFilter.addEventListener('change', applyFiltersAndRender);

        requestsTableBody.addEventListener('click', (e) => {
            if (e.target.classList.contains('table-image')) {
                imageZoomModal.classList.remove('hidden');
                zoomedImage.src = e.target.src;
            }
        });

        imageZoomModal.addEventListener('click', () => {
            imageZoomModal.classList.add('hidden');
            zoomedImage.src = '';
        });

        // --- Initial Load ---
        (async () => {
            populateFilters();
            await loadBranches();
            lucide.createIcons();
        })();

    </script>
</body>
</html>
